<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>รายละเอียดเคสงานบริการ · I-MODE Plus Service &amp; Maintenance · Beta 1.0 Service focus full system</title>
<link rel="icon" href="./assets/Iconservice.png">
<!--
  Service Case Detail — the full-page workspace for one case.

  Standalone on purpose: it is opened as its own document from the Service Cases list
  (service-case-detail.html?caseId=SRV-…), not injected into index.html, so the giant
  shared scope of the application is not a dependency and this page can be worked on
  without touching it.

  DATA
  The page never talks to Supabase itself. CaseDetailData is a read-only adapter over the
  same localStorage keys the application persists to, so opening a case here shows the
  real case rather than a mock, and nothing here can write over it. When the cloud becomes
  the source of truth, only the four marked functions in CaseDetailData change; no markup
  and no render function has to move. USE_MOCK_DATA is the third fallback and is used only
  when the id resolves to nothing, so the layout can still be reviewed on an empty device.

  STATE THAT IS PREPARED BUT NOT YET FILLED
  assignment / appointment / quotation / parts / qc / feedback / activity / internalNotes
  all exist on the ViewModel and render from whatever the case already carries. Where the
  application has no field for something yet (feedback, internal notes) the section says
  so rather than inventing a value.
-->
<style>
:root{
  --imode-blue:#0b63e5; --imode-navy:#0c225e; --imode-navy-2:#123a80;
  --imode-orange:#f27a1a; --imode-orange-dark:#d2620c;
  --ok:#079455; --warn:#f79009; --danger:#e31b2f;
  --ink:#12224a; --muted:#6b7d9e; --line:#e2ecfb; --line-2:#dfe9f8;
  --bg:#f4f8ff; --card:#fff;
  --radius:16px; --shadow:0 12px 30px rgba(18,58,128,.08);
  color-scheme:only light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  font-family:"Sarabun","Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
a{color:var(--imode-blue)}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 40px}

/* ---------- topbar ---------- */
.scd-topbar{
  position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(18,58,128,.05);
}
.scd-topbar-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.scd-menu{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:17px;flex:none}
.scd-menu:hover{border-color:#b9d2f4;background:#f4f8ff}
.scd-menu:focus-visible{outline:3px solid var(--imode-blue);outline-offset:2px}
.scd-backbtn{font-size:24px;line-height:1;color:var(--imode-navy);font-weight:700}
.scd-brand{display:flex;flex-direction:column;line-height:1.2;flex:none}
.scd-brand b{color:var(--imode-navy);font-size:15px;letter-spacing:.2px}
.scd-brand small{color:var(--muted);font-size:11px}
.scd-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#f6f9ff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.scd-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px}
.scd-tools{display:flex;align-items:center;gap:9px;flex:none}
.scd-chip-btn{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:var(--imode-navy)}
.scd-chip-btn:hover{border-color:#b9d2f4}
/* Measured at 1024 / 768 / 390 / 360: the breadcrumb and footer links were 20px tall,
   which is under the comfortable thumb target. Only the hit area grows; nothing moves. */
.scd-back{min-height:32px;display:inline-flex;align-items:center;gap:4px;padding:5px 2px}
.scd-foot .scd-back{padding:5px 8px}
/* The breadcrumb link and the media "ดูทั้งหมด" button were 20px tall, the two smallest
   things a finger has to hit on this page. Only the hit area grows. */
.scd-crumb a,.scd-crumb button{min-height:32px;display:inline-flex;align-items:center;padding:5px 2px}
.media-meta button{min-height:32px;display:inline-flex;align-items:center;padding:5px 6px}
.scd-bell{position:relative}
.scd-bell b{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
.scd-user{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 5px;border:1px solid var(--line);border-radius:999px;background:#fff}
.scd-user .av{width:32px;height:32px;border-radius:50%;background:var(--imode-navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.scd-user span{display:flex;flex-direction:column;line-height:1.2}
.scd-user b{font-size:12.5px;color:var(--imode-navy)}
.scd-user small{font-size:10.5px;color:var(--muted)}

/* ---------- breadcrumb + header ---------- */
.scd-crumb{display:flex;align-items:center;gap:9px;padding:16px 0 12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.scd-crumb a{text-decoration:none;font-weight:700}
.scd-crumb b{color:var(--imode-navy)}
.scd-headcard{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.scd-headmain{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.scd-title-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.scd-title-row h1{margin:0;font-size:28px;color:var(--imode-navy);letter-spacing:.3px}
.scd-customer{margin:6px 0 0;font-size:17px;font-weight:700;color:var(--imode-navy-2)}
.scd-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;font-size:13px;color:var(--ink)}
.scd-meta div{display:flex;align-items:center;gap:8px}
.scd-meta i{font-style:normal;font-size:15px}
.scd-meta small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;border:1px solid transparent;white-space:nowrap}
.badge-status{background:var(--imode-blue);color:#fff}
.badge-status.is-done{background:var(--ok)}
.badge-status.is-hold{background:var(--warn);color:#3a2500}
.badge-prio{background:#eef4ff;border-color:#cfe0fa;color:var(--imode-navy-2)}
.badge-prio.is-urgent{background:#fdeaea;border-color:#f6cccc;color:#a51f1f}
.badge-sub{background:#fff6e8;border-color:#f5dcb4;color:#8a5200}
.scd-sla{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.scd-sla h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.scd-sla-state{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;color:var(--ok)}
.scd-sla-state .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.scd-sla.is-risk .scd-sla-state{color:var(--warn)} .scd-sla.is-risk .dot{background:var(--warn)}
.scd-sla.is-over .scd-sla-state{color:var(--danger)} .scd-sla.is-over .dot{background:var(--danger)}
.scd-sla p{margin:9px 0 0;font-size:13px;color:var(--ink)}
.scd-sla-done{margin-top:12px;width:100%;min-height:40px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--imode-blue);background:var(--imode-blue);color:#fff;font:700 13px/1.3 inherit;
  cursor:pointer;box-shadow:0 4px 0 #0a4bb0;transition:transform .12s,box-shadow .12s}
.scd-sla-done:hover{transform:translateY(-2px);box-shadow:0 6px 0 #0a4bb0}
.scd-sla-done:active{transform:translateY(3px);box-shadow:0 1px 0 #0a4bb0}
@media (prefers-reduced-motion:reduce){.scd-sla-done{transition:none}
  .scd-sla-done:hover,.scd-sla-done:active{transform:none}}

/* ---------- progress ---------- */
.scd-progress{margin-top:18px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 18px 16px;overflow-x:auto}
.scd-steps{display:flex;align-items:flex-start;min-width:760px;list-style:none;margin:0;padding:0}
.scd-steps li{flex:1;position:relative;text-align:center;padding:0 6px}
.scd-steps li::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:#e3ecfa;z-index:0}
.scd-steps li:first-child::before{display:none}
.scd-steps li.done::before,.scd-steps li.now::before{background:var(--ok)}
.scd-steps .mark{position:relative;z-index:1;width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#eef2f9;color:#8ea2c2;font-weight:800;font-size:14px;border:3px solid #fff;box-shadow:0 0 0 2px #e3ecfa}
.scd-steps li.done .mark{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--ok)}
.scd-steps li.now .mark{background:var(--imode-blue);color:#fff;box-shadow:0 0 0 3px #cfe0fa}
.scd-steps b{display:block;margin-top:9px;font-size:13px;color:var(--imode-navy)}
.scd-steps li.pending b{color:#93a4c1}
.scd-steps small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.scd-steps li.now small{color:var(--imode-blue);font-weight:700}
.scd-after{display:flex;align-items:center;gap:9px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
.scd-after .mark{width:30px;height:30px;border-radius:50%;background:#eef2f9;color:#c6a02a;display:grid;place-items:center}
.scd-substates{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- 8. the circles are buttons ---------- */
.scd-steps li{padding:0}
.scd-step-btn{display:block;width:100%;border:0;background:none;padding:0 6px 4px;font:inherit;
  text-align:center;cursor:pointer;border-radius:12px;color:inherit}
.scd-step-btn:disabled{cursor:default}
.scd-step-btn:not(:disabled):hover .mark{transform:scale(1.08)}
.scd-step-btn:not(:disabled):hover b{color:var(--imode-blue)}
.scd-step-btn:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.scd-steps .mark{transition:transform .12s ease}
.scd-steps li.is-open .mark{box-shadow:0 0 0 4px #cfe0fa}
.scd-step-cue{display:block;margin-top:5px;font-size:11px;font-weight:700;font-style:normal;color:var(--imode-blue)}
.scd-steps li.is-blocked .scd-step-cue{color:#9a6516}
.scd-steps li.is-blocked .mark{background:#fdf0e2;color:#9a6516;box-shadow:0 0 0 2px #f3d3b2}

/* ---------- the drawer under a step ---------- */
.scd-stepdrawer{margin-top:14px;border:1px solid var(--line-2);border-radius:14px;
  background:#f8fbff;padding:14px 16px}
.sd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sd-head h4{margin:0;font-size:15px;color:var(--imode-navy)}
.sd-head p{margin:0;flex:1;font-size:12.5px;color:var(--muted)}
.sd-close{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:5px 12px;
  font:inherit;font-size:12px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-close:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;margin:0;font-size:13px}
.sd-kv dt{color:var(--muted)}
.sd-kv dd{margin:0;font-weight:600;color:var(--imode-navy);overflow-wrap:anywhere}
.sd-empty{margin:0;font-size:13px;color:var(--muted)}
.sd-hint{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.sd-ok{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--ok)}
.sd-wait{margin:10px 0 0;font-size:13px;font-weight:700;color:#9a6516}
.sd-acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.sd-team{margin-top:12px}
.sd-team>b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.sd-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sd-member{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:11px;
  padding:9px 11px;background:#fff;cursor:pointer;font-size:13px}
.sd-member.is-on{border-color:var(--imode-blue);background:#f3f8ff}
.sd-member span{font-weight:700;color:var(--imode-navy)}
.sd-member small{margin-left:auto;color:var(--muted);font-size:11.5px}
.sd-member input{width:17px;height:17px;flex:0 0 auto}
.sd-go{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 14px;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-go:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-go:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}

/* the technician's own nine-status track, under step 4 */
.sd-field{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto;min-width:0}
.sd-field li{flex:1 0 108px;position:relative;text-align:center;padding:0 4px}
.sd-field li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e3ecfa}
.sd-field li:first-child::before{display:none}
.sd-field li.done::before{background:var(--ok)}
.sd-field .fdot{position:relative;z-index:1;width:26px;height:26px;margin:0 auto;border-radius:50%;
  display:grid;place-items:center;background:#eef2f9;color:#8ea2c2;font-size:12px;font-weight:800;
  border:3px solid #fff;box-shadow:0 0 0 2px #e3ecfa}
.sd-field li.done .fdot{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--ok)}
.sd-field li.now .fdot{background:var(--imode-blue);color:#fff;box-shadow:0 0 0 3px #cfe0fa}
.sd-field b{display:block;margin-top:7px;font-size:11.5px;color:var(--imode-navy);line-height:1.35}
.sd-field li.pending b{color:#93a4c1}
.sd-field small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}

/* the status picker the ⇄ button opens */
.sd-statuses{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.sd-status{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 14px;
  font:inherit;font-size:13px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-status:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-status.is-now{background:var(--imode-blue);border-color:var(--imode-blue);color:#fff;cursor:default}
.sd-status:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}

/* ---------- the ใบตรวจ inside เอกสาร & รูปภาพ ---------- */
.rp-card{border:1px solid var(--line-2);border-radius:12px;background:#fff;padding:13px 15px;margin-top:9px}
.rp-card header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding-bottom:8px;margin-bottom:9px;border-bottom:1px solid var(--line)}
.rp-card header b{font-size:14.5px;color:var(--imode-navy)}
.rp-card header span{font-size:12px;color:var(--muted)}
.rp-kv{margin:0;display:grid;gap:6px}
.rp-line{display:grid;grid-template-columns:128px 1fr;gap:4px 12px;font-size:12.8px}
.rp-line dt{color:var(--muted);margin:0}
.rp-line dd{margin:0;color:var(--imode-navy);font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.rp-parts{margin-top:10px;font-size:12.8px}
.rp-parts b{display:block;color:var(--muted);font-weight:600;margin-bottom:3px}
.rp-parts ul{margin:0;padding-left:18px;color:var(--imode-navy)}
.rp-sign{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:11px;font-size:12px}
.rp-sign .ok{color:var(--ok);font-weight:700}
.rp-sign .no{color:var(--muted)}
.rp-card .sd-go{margin-top:11px}

/* ---------- 12. case age ---------- */
.scd-age.is-warn{color:#9a6516;font-weight:700}
.scd-age.is-late{color:#b3261e;font-weight:700}

/* ---------- action bar ---------- */
.scd-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-top:18px}
.scd-act{display:flex;align-items:center;justify-content:center;gap:9px;min-height:58px;padding:12px 14px;border-radius:14px;
  border:1px solid var(--line-2);background:#fff;color:var(--imode-navy);font-size:14.5px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 0 #e6eefb;transition:transform .14s ease,box-shadow .14s ease}
.scd-act i{font-style:normal;font-size:18px}
.scd-act:hover{transform:translateY(-2px);box-shadow:0 6px 0 #dbe6f8}
.scd-act:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe6f8}
.scd-act:focus-visible{outline:3px solid var(--imode-blue);outline-offset:2px}
.scd-act.primary{background:var(--imode-blue);border-color:var(--imode-blue);color:#fff;box-shadow:0 5px 0 #084bad}
.scd-act.primary:hover{box-shadow:0 7px 0 #084bad}
.scd-act.primary:active{box-shadow:0 1px 0 #084bad}
.scd-act.green{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 #05723f}
.scd-act.green:hover{box-shadow:0 7px 0 #05723f}
.scd-act.green:active{box-shadow:0 1px 0 #05723f}

/* ---------- main grid ---------- */
.scd-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.card-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.card-head .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#eef4ff;color:var(--imode-blue);flex:none}
.card-head h2{margin:0;font-size:17px;color:var(--imode-navy)}
.card-head .spacer{flex:1}

.problem{background:linear-gradient(180deg,#fff8f8,#fff);border-color:#f6d9d9}
.problem .card-head .ic{background:#fdeaea;color:var(--danger)}
.problem h3{margin:0;font-size:22px;color:#b3202c;line-height:1.35}
.problem .desc{margin:8px 0 0;font-size:16px;color:#7a2a2a}
.media-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.media-thumb{width:110px;height:82px;border-radius:11px;border:1px solid var(--line);background:#f2f5fb center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:11.5px;overflow:hidden}
.media-add{width:110px;height:82px;border-radius:11px;border:1.5px dashed #c9d8ef;background:#fbfdff;color:var(--imode-blue);font-size:12.5px;font-weight:700;cursor:pointer}
.media-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;color:var(--imode-navy-2)}
.media-meta button{border:0;background:transparent;color:var(--imode-blue);font-weight:700;cursor:pointer;padding:0}
/* รายละเอียดปัญหา — what the customer typed, in a panel of its own directly under the card
   head, with the attachments on the row below it. */
.issue-box{margin-top:14px;background:#fff;border:1px solid #f2d2d2;border-radius:12px;padding:12px 14px}
.issue-box>small{display:block;font-size:12.5px;font-weight:700;color:#a8535b;margin-bottom:6px}
.issue-box h3{margin:0;font-size:22px;color:#b3202c;line-height:1.35}
.issue-box .desc{margin:8px 0 0;font-size:16px;color:#7a2a2a}
/* The photos the CUSTOMER attached when they reported the problem. The application draws
   these through js/42 (.cm-block); this page is a separate document with its own CSS, so
   the same block is restated here rather than pulling in css/*. Real <img> tiles, not a
   background-image, so a portrait photo of a machine plate is not cropped to nothing, and
   every tile opens a lightbox — a 110px thumbnail is not evidence. */
.cmp-block{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.cmp-block>small{display:block;font-size:12.5px;font-weight:700;color:var(--imode-navy-2);margin-bottom:9px}
.cmp-grid{display:flex;flex-wrap:wrap;gap:10px}
.cmp-tile{width:110px;height:82px;padding:0;border-radius:11px;border:1px solid var(--line);background:#f2f5fb;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:20px}
.cmp-tile img{width:100%;height:100%;object-fit:cover;display:block}
.cmp-tile:hover{border-color:var(--imode-blue)}
.cmp-tile:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.cmp-tile.is-video{position:relative}
.cmp-grid .media-add{margin:0;line-height:1.3}
.cmp-lightbox{position:fixed;inset:0;z-index:12000;background:rgba(9,18,38,.86);display:grid;place-items:center;padding:18px}
.cmp-lightbox-inner{max-width:min(960px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:10px}
.cmp-lightbox img,.cmp-lightbox video{max-width:100%;max-height:80vh;border-radius:12px;background:#000;display:block;margin:0 auto}
.cmp-lightbox-bar{display:flex;align-items:center;gap:12px;color:#fff;font-size:13.5px}
.cmp-lightbox-bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-lightbox-close{min-width:36px;min-height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer}
.note-box{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.note-box b{display:block;font-size:13px;color:var(--imode-navy);margin-bottom:5px}
.note-box p{margin:0;font-size:13.5px;color:var(--ink)}

.machine-body{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px}
.machine-photo{width:100%;aspect-ratio:4/5;border-radius:12px;border:1px solid var(--line);background:#f7fafe;display:grid;place-items:center;overflow:hidden}
.machine-photo img{width:100%;height:100%;object-fit:contain}
.machine-photo span{color:var(--muted);font-size:12px}
.machine-photo{position:relative}
.machine-photo .ref-tag{position:absolute;left:8px;bottom:8px;background:rgba(12,34,94,.86);color:#fff;
  border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700}
.machine-title{margin:0 0 10px;font-size:19px;color:var(--imode-navy)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;color:var(--imode-navy-2);overflow-wrap:anywhere}
.warranty-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:800;background:#e9f8f0;color:#05723f;border:1px solid #c7ecd9}
.warranty-pill.is-expiring{background:#fff6e8;color:#8a5200;border-color:#f5dcb4}
.warranty-pill.is-expired{background:#fdeaea;color:#a51f1f;border-color:#f6cccc}
.spec-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.spec{background:#f7fafe;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.spec small{display:block;font-size:11px;color:var(--muted)}
.spec b{font-size:13px;color:var(--imode-navy)}

/* ---------- secondary modules ---------- */
.scd-modules{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:18px}
.scd-mod{display:flex;align-items:center;gap:11px;padding:15px 16px;border-radius:14px;border:1px solid var(--line-2);background:#fff;
  color:var(--imode-navy);font-size:14px;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 4px 0 #e6eefb;
  transition:transform .14s ease,box-shadow .14s ease}
.scd-mod i{font-style:normal;font-size:18px;width:32px;height:32px;border-radius:9px;background:#eef4ff;display:grid;place-items:center;flex:none}
.scd-mod span{flex:1;min-width:0}
.scd-mod u{text-decoration:none;color:var(--muted);font-weight:800}
.scd-mod:hover{transform:translateY(-2px);box-shadow:0 6px 0 #dbe6f8}
.scd-mod:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe6f8}
.scd-mod:focus-visible{outline:3px solid var(--imode-blue);outline-offset:2px}
.scd-mod[aria-expanded="true"]{border-color:#b9d2f4;background:#f6faff}

/* ---------- detail panel ---------- */
.scd-panel{margin-top:14px}
.scd-panel .card{border-style:solid}
.scd-panel .kv{margin-top:4px}
.scd-empty{color:var(--muted);font-size:13.5px;margin:0}
.scd-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.scd-list li{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fbfdff}
.scd-list li b{display:block;color:var(--imode-navy);font-size:13.5px}
.scd-list li small{color:var(--muted);font-size:12px}

/* ---------- footer ---------- */
.scd-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:22px}
.scd-back{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:12px;border:1px solid var(--line-2);
  background:#fff;color:var(--imode-navy);font-weight:700;cursor:pointer;text-decoration:none}
.scd-back:hover{border-color:#b9d2f4}
.scd-note-foot{color:var(--muted);font-size:12.5px;max-width:640px}
/* ลบเคส — destructive, so it never sits in the six-button action bar where a mis-tap
   costs something. It keeps the footer's shape and states its own danger in colour. */
.scd-danger{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:12px;
  border:1px solid #e8b4af;background:#fff;color:#b3261e;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.scd-danger:hover{border-color:#d9534f;background:#fdf3f2;color:#8f1d17}
.scd-danger:focus-visible{outline:2px solid #b3261e;outline-offset:2px}

/* ---------- states ---------- */
.scd-state{margin:60px auto;max-width:520px;text-align:center;background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:36px 26px;box-shadow:var(--shadow)}
.scd-state h2{margin:0 0 8px;color:var(--imode-navy);font-size:20px}
.scd-state p{margin:0 0 18px;color:var(--muted)}
.skeleton{background:linear-gradient(90deg,#eef3fb 25%,#f7fafe 50%,#eef3fb 75%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-row{height:16px;margin:10px 0}
.mock-flag{display:inline-flex;gap:7px;align-items:center;background:#fff6e8;border:1px solid #f5dcb4;color:#8a5200;
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;margin-top:12px}

/* ---------- toast ---------- */
#scdToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--imode-navy);color:#fff;border-radius:11px;padding:12px 18px;font-size:13px;z-index:60;transition:.2s}
#scdToast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1200px){
  .scd-actions{grid-template-columns:repeat(3,1fr)}
  .scd-modules{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:980px){
  .scd-headcard{grid-template-columns:1fr}
  .scd-grid{grid-template-columns:1fr}
  .scd-search{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 12px 32px}
  .scd-topbar-in{padding:9px 12px;gap:9px}
  .scd-title-row h1{font-size:22px}
  .scd-actions{grid-template-columns:repeat(2,1fr)}
  .scd-modules{grid-template-columns:1fr}
  .machine-body{grid-template-columns:120px minmax(0,1fr);gap:13px}
  .scd-user span{display:none}
  /* Two 40px buttons plus the brand and three tools do not fit 390px. The back arrow is
     the useful one on a phone; ☰ went to the same place, so it steps aside. */
  .scd-menu:not(.scd-backbtn){display:none}
  .scd-brand b{font-size:13px}
  .scd-brand small{font-size:10px}
  .scd-chip-btn{min-width:36px;height:36px;padding:0 9px}
}
@media (prefers-reduced-motion:reduce){
  .scd-act,.scd-mod{transition:none}
  .scd-act:hover,.scd-mod:hover{transform:none}
  .skeleton{animation:none}
}
</style>
</head>
<body>

<header class="scd-topbar">
  <div class="scd-topbar-in">
    <button class="scd-menu scd-backbtn" type="button" data-action="go-back" aria-label="ย้อนกลับไปหน้ารายการเคส">‹</button>
    <button class="scd-menu" type="button" data-action="open-app" aria-label="กลับไปที่ระบบหลัก">☰</button>
    <div class="scd-brand"><b>I-MODE SERVICE</b><small>Service focus full system · Beta 1.0</small></div>
    <label class="scd-search">🔍<input id="scdSearch" type="search" placeholder="ค้นหาเคส / ลูกค้า / Serial / รุ่นเครื่อง ..." aria-label="ค้นหา"></label>
    <div class="scd-tools">
      <button class="scd-chip-btn scd-bell" type="button" data-action="open-notifications" aria-label="การแจ้งเตือน">🔔<b id="scdBell">0</b></button>
      <button class="scd-chip-btn" type="button" data-action="toggle-language" id="scdLang">TH</button>
      <div class="scd-user"><div class="av" id="scdUserAv">--</div><span><b id="scdUserName">ยังไม่ได้เข้าสู่ระบบ</b><small id="scdUserRole">Guest</small></span></div>
    </div>
  </div>
</header>

<main class="wrap" id="scdMain">
  <div class="scd-state" id="scdLoading">
    <h2>กำลังโหลดข้อมูลเคส...</h2>
    <div class="skeleton sk-row" style="width:70%;margin-inline:auto"></div>
    <div class="skeleton sk-row" style="width:50%;margin-inline:auto"></div>
  </div>
</main>

<div id="scdToast" role="status" aria-live="polite"></div>

<!-- Beta 1.0: this page can now write. The status circles change the case, so it needs the
     same Supabase client the application uses; the connection details are read from the
     config the app already stored on this device. Nothing else on the page writes. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* =======================================================================
   0. configuration
   ======================================================================= */
/* Local storage is the live source on every device today; the cloud copy is pulled into
   it by the application's own syncCloud(). Flip USE_CLOUD when this page should read
   Supabase directly — only loadAll() below changes. */
var USE_CLOUD=false;
/* Third fallback, so the layout is still reviewable on a device with no data at all. */
var USE_MOCK_DATA=true;

var K={
  cases:'imode_test_v532_cases',
  customers:'imode_test_v532_customers',
  machines:'imode_test_v532_machines',
  tech:'imode_v5_tech',
  warranties:'imode_test_v532_warranties',
  reports:'imode_test_v532_service_reports',
  lineRequests:'imode_test_v532_line_requests',
  quotes:'imode_test_v532_quotes',
  notifications:'imode_test_v532_notifications',
  settings:'imode_v5_settings',
  user:'imode_v5_current_user'
};
var APP='./index.html';

/* =======================================================================
   1. helpers
   ======================================================================= */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function readJSON(key,fallback){
  try{var raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}
}
function el(id){return document.getElementById(id)}
/* The same precedence the application's canPermission() uses — an enabled per-user entry
   wins, otherwise the resolved role's list — read from the same two keys. It is a display
   gate only: the delete itself is carried out by the application, which checks again with
   requirePermission(). Enforcement off means everything is allowed, exactly as in the app. */
function permissionRoleName(u,roles){
  var raw=String((u&&(u.permissionRole||u.role))||'');
  var names=(roles||[]).map(function(r){return String(r.name||'')});
  if(names.indexOf(raw)>=0)return raw;
  var n=raw.toLowerCase(),find=function(x){return names.indexOf(x)>=0?x:raw};
  if(n.indexOf('service manager')>=0||n.indexOf('supervisor')>=0)return find('Service Manager');
  if(n.indexOf('executive secretary')>=0||n.indexOf('admin')>=0||n.indexOf('coordinator')>=0)return find('Admin / Coordinator');
  if(n.indexOf('technician')>=0||n==='r&d'||n.indexOf('engineer')>=0)return find('Technician');
  if(n.indexOf('sales')>=0||n.indexOf('marketing')>=0)return find('Sales');
  return raw;
}
function can(key){
  var s=readJSON(K.settings,{})||{};
  if(!(s.systemBehavior&&s.systemBehavior.enforceRolePermissions))return true;
  var u=readJSON(K.user,null);
  var entry=(s.userPermissions||{})[String((u&&(u.id||u.name))||'').trim()];
  if(entry&&entry.enabled)return (entry.permissions||[]).indexOf(key)>=0;
  var roles=Array.isArray(s.roles)?s.roles:[];
  var r=roles.filter(function(x){return String(x.name||'')===permissionRoleName(u,roles)})[0];
  return !!(r&&(r.permissions||[]).indexOf(key)>=0);
}
function toast(msg){
  var t=el('scdToast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2400);
}
function fmtDateTime(v){
  if(!v)return '-';
  var d=new Date(v);if(isNaN(d))return String(v);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' '+
         d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function fmtDay(v){
  if(!v)return '-';
  var d=new Date(v);if(isNaN(d))return String(v);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function daysBetween(a,b){return Math.round((new Date(a)-new Date(b))/86400000)}
/* 12. how long this case has been open. It counts to the day it closed, not to today —
   a case closed last month is 3 days old, not 40. */
function caseAgeMs(c){
  var from=new Date(c&&c.createdAt||0).getTime();
  if(!from||isNaN(from))return 0;
  var closed=['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0;
  var to=closed?new Date(c.updatedAt||Date.now()).getTime():Date.now();
  return Math.max(0,to-from);
}
function caseAge(c){
  var ms=caseAgeMs(c);
  if(!ms)return '-';
  var d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),mi=Math.floor(ms%3600000/60000);
  var closed=['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0;
  var txt=d?(d+' วัน '+h+' ชม.'):(h?(h+' ชม. '+mi+' นาที'):(mi+' นาที'));
  return txt+(closed?' (จนถึงวันปิดงาน)':'');
}
/* Only an OPEN case can look old. */
function ageTone(c){
  if(['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0)return '';
  var d=caseAgeMs(c)/86400000;
  return d>=7?'late':(d>=3?'warn':'');
}

/* Machine image priority, kept the same as the application's:
   the machine's own photo, then a family reference image, then No Image. A reference
   image is only ever displayed — it is never written back onto the machine. */
var MACHINE_FAMILY={
  hydrogenHo500:'./assets/machines/hydrogen-ho500wt.webp',
  hydrogenHo200:'./assets/machines/hydrogen-ho200wt.webp',
  nitrogen:'./assets/machines/nitrogen-generator.webp',
  laserMarking:'./assets/machines/laser-marking-bgf20.jpg',
  laserWelding:'./assets/machines/laser-welding.webp',
  blueThunder:'./assets/machines/welding-blue-thunder.jpg',
  centrifugalVa20:'./assets/machines/centrifugal-va20.jpg',
  centrifugalVa38:'./assets/machines/centrifugal-va38.jpg',
  polishingFamily:'./assets/machines/polishing-family.webp'
};
function familyPhoto(m){
  if(!m)return '';
  var text=[m.model,m.name,m.nameTh,m.nameEn].filter(Boolean).join(' ').toLowerCase();
  var compact=text.replace(/[\s_-]+/g,'');
  if(compact.indexOf('ho500wt')>=0)return MACHINE_FAMILY.hydrogenHo500;
  if(compact.indexOf('ho200wt')>=0)return MACHINE_FAMILY.hydrogenHo200;
  if(/n\s*-?\s*(20|40)/i.test(text)||text.indexOf('nitrogen gas generator')>=0
     ||text.indexOf('เครื่องผลิตแก๊สไนโตรเจน')>=0)return MACHINE_FAMILY.nitrogen;
  if(/blue\s*-?\s*thunder/i.test(text))return MACHINE_FAMILY.blueThunder;
  if(/laser\s*weld|bull\s*thunder|เครื่องเชื่อมเลเซอร์/i.test(text))return MACHINE_FAMILY.laserWelding;
  if(/bgf\s*-?\s*20|laser\s*mark|เครื่องมาร์กเลเซอร์/i.test(text))return MACHINE_FAMILY.laserMarking;
  if(/va\s*38/i.test(text))return MACHINE_FAMILY.centrifugalVa38;
  if(/va\s*20/i.test(text))return MACHINE_FAMILY.centrifugalVa20;
  if(/va\s*18|20\s*l\s*x\s*3|msh|gyratory\s*polish|เครื่องขัดระบบไจเรต/i.test(text))return MACHINE_FAMILY.polishingFamily;
  if(/centrifugal\s*disc\s*finishing|เครื่องขัดแบบจานหมุนเหวี่ยง/i.test(text))return MACHINE_FAMILY.polishingFamily;
  return '';
}

/* getCaseIdFromUrl — the only thing the URL ever carries. */
function getCaseIdFromUrl(){
  var p=new URLSearchParams(window.location.search);
  return (p.get('caseId')||p.get('case')||'').trim();
}

/* =======================================================================
   2. data adapter
   Everything the page reads goes through here. Swapping localStorage for Supabase means
   rewriting these functions and nothing else — no render function touches storage.
   ======================================================================= */
var CaseDetailData=(function(){
  var db=null;
  function all(){
    if(db)return db;
    db={
      cases:readJSON(K.cases,[])||[],
      customers:readJSON(K.customers,[])||[],
      machines:readJSON(K.machines,[])||[],
      technicians:readJSON(K.tech,[])||[],
      warranties:readJSON(K.warranties,[])||[],
      reports:readJSON(K.reports,[])||[],
      lineRequests:readJSON(K.lineRequests,[])||[],
      quotes:readJSON(K.quotes,[])||[],
      notifications:readJSON(K.notifications,[])||[],
      settings:readJSON(K.settings,{})||{},
      user:readJSON(K.user,null)
    };
    return db;
  }
  function byId(list,id){
    for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];
    return null;
  }
  return {
    /* A case is found by id or by ticket, so a link may carry either. */
    loadCase:function(caseId){
      var list=all().cases;
      return Promise.resolve(byId(list,caseId)||list.filter(function(c){
        return String(c.ticket||'').toLowerCase()===String(caseId||'').toLowerCase();
      })[0]||null);
    },
    loadMachine:function(machineId){return Promise.resolve(byId(all().machines,machineId))},
    loadCustomer:function(customerId){return Promise.resolve(byId(all().customers,customerId))},
    loadTechnician:function(techId){return Promise.resolve(byId(all().technicians,techId))},
    allTechnicians:function(){return all().technicians.slice()},
    currentUser:function(){return all().user},
    roles:function(){return (all().settings.roles)||[]},
    loadMachineHistory:function(machineId){
      return Promise.resolve(all().cases.filter(function(c){return c.machineId===machineId}));
    },
    loadWarranty:function(machineId){
      var w=all().warranties.filter(function(x){return x.machineId===machineId})
        .sort(function(a,b){return new Date(b.endDate||0)-new Date(a.endDate||0)});
      return Promise.resolve(w[0]||null);
    },
    loadAssignment:function(c){
      return Promise.resolve({technicianId:c&&c.assignee||'',assignedAt:c&&c.updatedAt||'',
        coordinator:(all().user&&all().user.name)||''});
    },
    loadAppointment:function(c){
      return Promise.resolve({date:c&&c.appointment||'',location:c&&c.location||'',
        contact:c&&c.contact||'',status:c&&c.appointment?'confirmed':'pending'});
    },
    loadQuotation:function(caseId){
      var q=all().quotes.filter(function(x){return x.caseId===caseId})
        .sort(function(a,b){return new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0)});
      return Promise.resolve(q[0]||null);
    },
    loadReports:function(caseId){
      return Promise.resolve(all().reports.filter(function(r){return r.caseId===caseId}));
    },
    loadAttachments:function(c){
      /* Case evidence lives in three places, and all three are read so the card shows what
         really exists rather than a placeholder count: what the CUSTOMER attached when they
         reported the problem (c.media — this one was missed, which is why a reported photo
         never appeared here), then the field status log, then the service report. */
      var out=[];
      /* The same fallback js/42 uses in the application: submitPortalIssue() writes the
         attachments to BOTH the case and the line_customer_requests row, and until
         06-v70-case-media.sql the case column did not exist, so on a second device the
         photos can only be on the request. Without this the popup showed them and this page
         did not, for the same case. */
      var media=(c&&c.media&&c.media.length)?c.media:(function(){
        try{
          var reqs=all().lineRequests||[];
          for(var i=0;i<reqs.length;i++){
            var r=reqs[i];
            if(r&&r.caseId===(c&&c.id)&&r.media&&r.media.length)return r.media;
          }
        }catch(e){}
        return [];
      })();
      media.forEach(function(m){
        out.push({type:/^video\//i.test(String(m.type||''))?'video':'image',
          name:m.name||'',data:m.data||'',at:c.createdAt,from:'customer'});
      });
      (c&&c.fieldStatusLog||[]).forEach(function(entry){
        /* The log stores a MIME type ("image/jpeg"); every reader on this page compares
           against the bare word, so these were being counted as neither photo nor video
           and drawn as nothing. Normalised on the way in, like the two blocks around it. */
        (entry.media||[]).forEach(function(m){out.push({
          type:/^video\//i.test(String(m.type||''))?'video':'image',
          name:m.name||'',data:m.data||'',at:entry.createdAt})});
      });
      return this.loadReports(c&&c.id).then(function(reports){
        reports.forEach(function(r){
          (r.beforePhotos||[]).forEach(function(d){out.push({type:'image',name:'before',data:d})});

    loadFeedback:function(){return Promise.resolve(null)},

    },
    currentUser:function(){return all().user},
    /* all() reads storage once and keeps it — which is right for a page that only reads,
       and wrong the moment the page writes. Anything that changes a record clears the
       cache so the next load() sees what was actually saved. */
    refresh:function(){db=null},

    isEmpty:function(){return !all().cases.length}

function load(){

   6. render — one function per region, no data access
   ======================================================================= */
/* =======================================================================
   5b. writing — the only part of this page that changes anything
   The status circles in section 6 move the case forward, so the page needs a real write.
   It does two things and no more:
     1. rewrites this one case inside imode_test_v532_cases, the array the whole
        application reads;
     2. UPDATEs the two columns that changed on Supabase — update(), never upsert(), so a
        payload that does not name every column cannot blank the rest of the row.
   The connection is read from imode_v5_cloud, which js/23 writes on this device the first
   time the application boots. With no config the local write still happens and the caller
   is told the change has not left this device, rather than being told it worked.
   ======================================================================= */
var CaseWrite=(function(){
  var client=null,tried=false;
  function cfg(){
    try{var c=JSON.parse(localStorage.getItem('imode_v5_cloud')||'{}');return (c&&c.url&&c.key)?c:null}
    catch(e){return null}
  }
  function db(){
    if(tried)return client;
    tried=true;
    var c=cfg();
    try{if(c&&window.supabase)client=window.supabase.createClient(c.url,c.key)}catch(e){client=null}
    return client;
  }
  function localCases(){return readJSON(K.cases,[])||[]}
  /* Returns a promise that resolves {ok, cloud} — cloud:false means it is on this device
     only, which the caller says out loud. */
  function patch(caseId,changes){
    var list=localCases(),hit=null;
    for(var i=0;i<list.length;i++){
      if(list[i]&&list[i].id===caseId){hit=list[i];break}
    }
    if(!hit)return Promise.resolve({ok:false,reason:'not-found'});
    for(var k in changes)if(Object.prototype.hasOwnProperty.call(changes,k))hit[k]=changes[k];
    hit.updatedAt=new Date().toISOString();
    try{localStorage.setItem(K.cases,JSON.stringify(list))}catch(e){return Promise.resolve({ok:false,reason:'storage'})}
    /* keep the page's own model in step so the next render shows the new state */
    try{if(caseDetailModel&&caseDetailModel.case&&caseDetailModel.case.id===caseId){
      if('status' in changes)caseDetailModel.case.status=changes.status;
      caseDetailModel.case.updatedAt=hit.updatedAt;
    }}catch(e){}

    var sb=db();
    if(!sb)return Promise.resolve({ok:true,cloud:false});
    var row={updated_at:hit.updatedAt};
    if('status' in changes)row.status=changes.status;
    /* service_cases has one `assignee` column and no `assignees`. js/38 puts the whole crew
       in it as a comma list, lead first, and splits it apart again on the way in — so this
       page has to write the same shape or a two-technician job would come back as one. */
    if('assignees' in changes||'assignee' in changes){
      var crew=changes.assignees||(changes.assignee?[changes.assignee]:[]);
      row.assignee=crew.length?crew.join(','):null;
    }
    try{
      return Promise.resolve(sb.from('service_cases').update(row).eq('id',caseId))
        .then(function(r){
          if(r&&r.error){console.warn('[scd] cloud update failed',r.error);return {ok:true,cloud:false,error:r.error}}
          return {ok:true,cloud:true};
        },function(e){console.warn('[scd] cloud update threw',e);return {ok:true,cloud:false,error:e}});
    }catch(e){return Promise.resolve({ok:true,cloud:false,error:e})}
  }
  return {
    setStatus:function(id,status){return patch(id,{status:status})},
    /* Assigning is the one other thing this page may change. The lead is always ids[0], the
       same rule js/38 enforces, so `assignee` and `assignees` can never disagree. A case
       still sitting at เคสใหม่ moves on to มอบหมายแล้ว in the same write, exactly as
       js/16's imodeAssignCase() does it — and the technician's own device derives the
       "you have been given a job" notice from the case itself (part 16 §5), so nothing
       else has to be sent. */
    setAssignees:function(id,ids,caseStatus){
      var crew=[],seen={};
      (ids||[]).forEach(function(v){
        var t=String(v||'').trim();
        if(!t||seen[t])return;
        seen[t]=1;crew.push(t);
      });
      var changes={assignees:crew,assignee:crew[0]||''};
      if(crew.length&&caseStatus==='เคสใหม่')changes.status='มอบหมายแล้ว';
      return patch(id,changes);
    },
    configured:function(){return !!cfg()}
  };
})();

/* ---------- what the technician has done, read from the case ---------- */
/* The nine field statuses are js/03's FIELD_STATUSES, in order. The case carries the
   current one in fieldStatus and the whole history in fieldStatusLog, so this page can
   show the technician's progress without asking the application for anything. */
var FIELD_STEPS=['กำลังเดินทาง','ถึงหน้างาน','เริ่มตรวจเช็ก','กำลัง PM / Maintenance',
                 'กำลังซ่อม Service','รออะไหล่','ทดสอบเครื่อง','รอลูกค้าตรวจรับ','จบงาน'];
function fieldLog(m){
  var log=(m&&m.raw&&m.raw.fieldStatusLog)||[];
  return Array.isArray(log)?log:[];
}
function fieldReached(m){
  var hit={};
  fieldLog(m).forEach(function(e){if(e&&e.status)hit[e.status]=e.createdAt||e.timestamp||''});
  var now=(m&&m.raw&&m.raw.fieldStatus)||(m&&m.case&&m.case.subStatus)||'';
  if(now&&!Object.prototype.hasOwnProperty.call(hit,now))hit[now]='';
  return hit;
}
/* "the technician has finished" — จบงาน on the field track, or a service report exists.
   Either one is proof the work is over; a case can reach เสร็จสิ้น through the report path
   without the field track ever being touched. */
function fieldDone(m){
  if(!m||!m.case)return false;
  var now=(m.raw&&m.raw.fieldStatus)||m.case.subStatus||'';
  if(String(now)==='จบงาน')return true;
  if(Object.prototype.hasOwnProperty.call(fieldReached(m),'จบงาน'))return true;
  return !!(m.closing&&m.closing.serviceReportReady);
}

var STEPS=[
  {th:'รับแจ้งปัญหา',statuses:['เคสใหม่']},
  {th:'ตรวจสอบ / มอบหมาย',statuses:['มอบหมายแล้ว']},
  {th:'นัดหมายบริการ',statuses:['นัดหมายแล้ว']},
  {th:'กำลังให้บริการ',statuses:['กำลังดำเนินการ','รออะไหล่']},
  {th:'งานเสร็จ / ตรวจรับ',statuses:['รอส่งงาน','เสร็จสิ้น']},
  {th:'ปิดเคส',statuses:['ปิดเคส']}
];
/* Hold states are shown as their own badges. They are never one of the six steps: a case
   that is waiting for parts is still at "กำลังให้บริการ". */
var HOLD_STATES={'รออะไหล่':'📦 รออะไหล่'};

function stepIndex(status){
  for(var i=0;i<STEPS.length;i++)if(STEPS[i].statuses.indexOf(status)>=0)return i;
  return 0;
}

function renderCaseHeader(m){

        +'<div><i>👤</i><small>ผู้ติดต่อ:</small> '+esc(m.customer.contactName||'-')

/* SLA is computed from what the case actually carries: a case nobody has picked up is on
   the response clock, a scheduled case counts down to its appointment, anything else has
   no target and says so rather than inventing "On Time". */
function renderSla(m){
  var c=m.case,cls='',state='On Time',line='',act='';
  if(['เสร็จสิ้น','ปิดเคส'].indexOf(c.status)>=0){
    state='Closed';line='ปิดงานแล้ว '+esc(fmtDateTime(c.updatedAt));
  }else if(!m.assignment.technician&&respondedStamp(c)){
    /* Answered but not yet assigned. The clock is settled; the case is not. */
    var rs=respondedStamp(c);
    state='Responded';line='ตอบกลับลูกค้าแล้ว '+esc(fmtDateTime(rs.at))
      +(rs.by?' · '+esc(rs.by):'');
  }else if(!m.assignment.technician&&c.status==='เคสใหม่'){
    var mins=30,left=new Date(c.createdAt).getTime()+mins*60000-Date.now();
    if(left<0){cls='is-over';state='Overdue';line='เกินเวลาตอบกลับ '+fmtLeft(-left);}
    else{cls=left<=10*60000?'is-risk':'';state=left<=10*60000?'At Risk':'On Time';
         line='ต้องตอบกลับภายใน '+fmtLeft(left);}
    /* This page never writes — it reads localStorage and hands every edit back to the
       application, which is also the only place that can push the stamp to Supabase. So
       the button is a hand-off: js/28 picks the intent up and calls imodeMarkResponded(). */
    act='<button type="button" class="scd-sla-done" data-action="mark-responded">'
       +'⏱ บันทึกว่าตอบกลับแล้ว</button>';
  }else if(c.status==='รออะไหล่'){
    cls='is-risk';state='On Hold';line='รออะไหล่ · นาฬิกางานหยุดชั่วคราว';
  }else if(m.appointment.date){
    var d=new Date(m.appointment.date)-Date.now();
    if(d<0){cls='is-over';state='Overdue';line='เลยเวลานัด '+fmtLeft(-d);}
    else{cls=d<=2*3600000?'is-risk':'';state=d<=2*3600000?'At Risk':'On Time';
         line='เหลืออีก '+fmtLeft(d)+' ถึงเวลานัด';}
  }else{
    cls='is-risk';state='No target';line='ยังไม่มีนัดหมาย จึงยังไม่มีกำหนด SLA';
  }
  return '<aside class="scd-sla '+cls+'"><h3>SLA</h3>'
    +'<div class="scd-sla-state"><span class="dot"></span>'+esc(state)+'</div>'
    +'<p>'+esc(line)+'</p>'+act+'</aside>';
}
function fmtLeft(ms){
  var mins=Math.floor(ms/60000),h=Math.floor(mins/60),m2=mins%60;
  return h?(h+' ชม. '+m2+' นาที'):(m2+' นาที');
}

/* Which step is open underneath the track. null = none. */
var openStep=null;

function renderProgress(m){
  var idx=stepIndex(m.case.status),closed=m.case.status==='ปิดเคส';
  var times=stepTimes(m);
  var canWork=fieldDone(m);
  var lis=STEPS.map(function(s,i){
    var cls=i<idx?'done':i===idx?'now':'pending';
    var mark=i<idx?'✔':String(i+1);
    /* WHAT A CIRCLE DOES depends on where it sits.
         behind or on the current step  → open it and show what happened there
         exactly one step ahead         → move the case forward to it
         further ahead                  → nothing; you cannot skip stages
       The one gate: step 5 cannot be reached while the technician is still working, and
       clicking it then opens step 4's track instead of refusing silently. */
    var role = i<=idx ? 'open' : (i===idx+1 ? 'next' : 'far');
    var blocked = (role==='next' && idx===3 && !canWork);
    var hint = role==='open' ? 'ดูรายละเอียดขั้นนี้'
             : blocked ? 'รอช่างอัปเดตให้จบกระบวนการก่อน — กดเพื่อดูความคืบหน้า'
             : role==='next' ? 'กดเพื่อไปขั้นนี้'
             : 'ต้องผ่านขั้นก่อนหน้าก่อน';
    return '<li class="'+cls+(openStep===i?' is-open':'')+(blocked?' is-blocked':'')+'">'
      +'<button type="button" class="scd-step-btn" data-step="'+i+'" data-role="'+role+'"'
      +(role==='far'?' disabled':'')
      +' title="'+esc(hint)+'" aria-expanded="'+(openStep===i)+'"'
      +' aria-label="'+esc((i+1)+'. '+s.th+' — '+hint)+'">'
      +'<span class="mark">'+mark+'</span>'
      +'<b>'+(i+1)+'. '+esc(s.th)+'</b>'
      +(times[i]?'<small>'+esc(times[i])+'</small>':'')
      +(role==='next'?'<em class="scd-step-cue">'+(blocked?'🔒 รอช่าง':'กดเพื่อไปต่อ ›')+'</em>':'')
      +'</button></li>';
  }).join('');
  var subs='';
  if(HOLD_STATES[m.case.status])subs+='<span class="badge badge-sub">'+esc(HOLD_STATES[m.case.status])+'</span>';
  if(m.case.subStatus)subs+='<span class="badge badge-prio">หน้างาน: '+esc(m.case.subStatus)+'</span>';
  return '<section class="scd-progress" aria-label="ความคืบหน้าของเคส">'
    +'<ol class="scd-steps">'+lis+'</ol>'
    +(openStep==null?'':'<div class="scd-stepdrawer">'+stepDrawerHTML(m,openStep)+'</div>')
    +(subs?'<div class="scd-substates">'+subs+'</div>':'')
    +'<div class="scd-after"><span class="mark">★</span>'
    +(closed?'<button class="scd-mod" style="box-shadow:none;padding:6px 12px" type="button" data-action="open-feedback">ประเมินความพึงพอใจ</button>'
            :'ประเมินความพึงพอใจ (หลังปิดเคส)')
    +'</div></section>';
}
/* ---------- the drawer under a step ----------
   One claim per step: what happened there, and where to go next. Step 4 is the one the
   sketch asks for — the technician's own nine-status track drawn underneath the six, so an
   admin can see exactly how far the job has got without leaving the page. */
function stepDrawerHTML(m,i){
  var c=m.case;
  var head=function(t,sub){
    return '<div class="sd-head"><h4>'+esc(t)+'</h4>'+(sub?'<p>'+esc(sub)+'</p>':'')
      +'<button type="button" class="sd-close" data-action="close-step">ปิด</button></div>';
  };
  if(i===0){
    return head('1. รับแจ้งปัญหา','เคสนี้เข้ามาอย่างไร')
      +'<dl class="sd-kv"><dt>รับแจ้ง</dt><dd>'+esc(fmtDateTime(c.createdAt))+'</dd>'
      +'<dt>ช่องทาง</dt><dd>'+esc(c.source||'-')+'</dd>'
      +'<dt>ผู้ติดต่อ</dt><dd>'+esc(m.customer.contactName||'-')+(m.customer.phone?' · '+esc(m.customer.phone):'')+'</dd>'
      +'<dt>อาการที่แจ้ง</dt><dd>'+esc(c.issueDescription||c.issueTitle||'-')+'</dd></dl>';
  }
  if(i===1){
    var t=m.assignment.technician;
    return head('2. ตรวจสอบ / มอบหมาย','ใครรับผิดชอบงานนี้')
      +(t?'<dl class="sd-kv"><dt>ช่างผู้รับผิดชอบ</dt><dd>'+esc(t.name||'-')+'</dd>'
          +'<dt>มอบหมายเมื่อ</dt><dd>'+esc(fmtDateTime(m.assignment.assignedAt))+'</dd></dl>'
        :'<p class="sd-empty">ยังไม่ได้มอบหมายช่าง</p>')
      +'<div class="sd-acts"><button type="button" class="sd-go" data-action="assign-technician">เลือกช่าง / มอบหมายงาน ›</button></div>';
  }
  if(i===2){
    return head('3. นัดหมายบริการ','วันเวลาที่นัดลูกค้าไว้')
      +(m.appointment.date
        ?'<dl class="sd-kv"><dt>นัดหมาย</dt><dd>'+esc(fmtDateTime(m.appointment.date))+'</dd>'
         +'<dt>สถานที่</dt><dd>'+esc(m.appointment.location||m.customer.address||'-')+'</dd></dl>'
        :'<p class="sd-empty">ยังไม่มีนัดหมาย</p>')
      +'<div class="sd-acts"><button type="button" class="sd-go" data-action="schedule-service">ตั้ง / แก้นัดหมาย ›</button></div>';
  }
  if(i===3){
    /* the technician's track, drawn under the main one */
    var hit=fieldReached(m),done=fieldDone(m);
    var dots=FIELD_STEPS.map(function(fs,k){
      var on=Object.prototype.hasOwnProperty.call(hit,fs);
      var isNow=String((m.raw&&m.raw.fieldStatus)||c.subStatus||'')===fs;
      return '<li class="'+(on?'done':'pending')+(isNow?' now':'')+'">'
        +'<span class="fdot">'+(on?'✔':String(k+1))+'</span>'
        +'<b>'+esc(fs)+'</b>'
        +(hit[fs]?'<small>'+esc(fmtDateTime(hit[fs]))+'</small>':'')+'</li>';
    }).join('');
    return head('4. กำลังให้บริการ','ความคืบหน้าที่ช่างอัปเดตจากหน้างาน')
      +'<ol class="sd-field">'+dots+'</ol>'
      +'<p class="'+(done?'sd-ok':'sd-wait')+'">'
      +(done?'✔ ช่างทำงานเสร็จแล้ว — กดวงกลมขั้นที่ 5 เพื่อไปต่อได้'
            :'⏳ ยังรอช่างอัปเดตให้ถึง “จบงาน” หรือบันทึกใบตรวจ ระหว่างนี้ยังข้ามไปขั้นถัดไปไม่ได้')+'</p>'
      +'<div class="sd-acts"><button type="button" class="sd-go" data-action="open-field-service">เปิดหน้างานช่าง ›</button></div>';
  }
  if(i===4){
    return head('5. งานเสร็จ / ตรวจรับ','ใบตรวจและเอกสารของงานนี้')
      +'<dl class="sd-kv"><dt>ใบตรวจ</dt><dd>'
      +(m.closing.serviceReportReady?'มีใบตรวจแล้ว':'ยังไม่มีใบตรวจ')+'</dd>'
      +'<dt>เครื่อง</dt><dd>'+esc(m.machine.name||'-')
      +(m.machine.serialNumber?' · S/N '+esc(m.machine.serialNumber):'')+'</dd></dl>'
      +'<div class="sd-acts">'
      +'<button type="button" class="sd-go" data-action="open-case-attachments">เอกสาร &amp; รูปภาพ ›</button>'
      +'<button type="button" class="sd-go" data-action="open-machine-history">ประวัติ / เอกสารเครื่อง ›</button>'
      +'</div>'
      +'<p class="sd-hint">ตรวจรับเรียบร้อยแล้วกดวงกลมขั้นที่ 6 เพื่อปิดเคส หรือใช้ปุ่ม เปลี่ยนสถานะ ก็ได้</p>';
  }
  return head('6. ปิดเคส','งานนี้จบแล้ว')
    +'<dl class="sd-kv"><dt>ปิดเมื่อ</dt><dd>'+esc(fmtDateTime(c.updatedAt))+'</dd></dl>'
    +'<div class="sd-acts"><button type="button" class="sd-go" data-action="open-feedback">ประเมินความพึงพอใจ ›</button></div>';
}

/* Only the timestamps the case really has are shown under a step. */
function stepTimes(m){
  var out=[];
  out[0]=m.case.createdAt?fmtDateTime(m.case.createdAt):'';
  out[1]=m.assignment.technician?fmtDateTime(m.assignment.assignedAt):'';
  out[2]=m.appointment.date?fmtDateTime(m.appointment.date):'';
  var log=(m.activity||[]).filter(function(a){return a.type==='field_status'});
  out[3]=log.length?fmtDateTime(log[log.length-1].timestamp):'';
  out[4]=m.closing.serviceReportReady?'มีใบตรวจแล้ว':'';
  out[5]=m.case.status==='ปิดเคส'?fmtDateTime(m.case.updatedAt):'';
  return out;
}

/* A tile per attachment, addressed by its index in caseDetailModel.attachments — a data
   URL is tens of thousands of characters and has no business inside an attribute, so the
   index travels and the lightbox reads the array. */
function mediaTiles(items){
  return items.map(function(x){
    var body=(x.a.type==='image'&&x.a.data)
      ? '<img src="'+esc(x.a.data)+'" alt="'+esc(x.a.name||'')+'" loading="lazy">'
      : '<span>'+(x.a.type==='video'?'&#9654;':'&#128196;')+'</span>';
    return '<button type="button" class="cmp-tile'+(x.a.type==='video'?' is-video':'')+'"'
      +' data-media="'+x.i+'" title="'+esc(x.a.name||'')+'"'
      +' aria-label="เปิดไฟล์แนบ '+(x.i+1)+'">'+body+'</button>';
  }).join('');
}
function mediaBlock(label,items){
  if(!items.length)return '';
  var photos=items.filter(function(x){return x.a.type==='image'}).length;
  var clips=items.filter(function(x){return x.a.type==='video'}).length;
  return '<div class="cmp-block"><small>'+esc(label)+' · '+photos+' รูป'
    +(clips?' · '+clips+' วิดีโอ':'')+'</small><div class="cmp-grid">'+mediaTiles(items)+'</div></div>';
}

function renderProblem(m){
  var c=m.case;
  var imgs=m.attachments.filter(function(a){return a.type==='image'});
  var vids=m.attachments.filter(function(a){return a.type==='video'});

    +(c.priority==='ด่วนมาก'?'<span class="badge badge-prio is-urgent">เร่งด่วน</span>':'')+'</div>'

      +(fromCustomer.length?' · '+fromCustomer.filter(function(x){return x.a.type==='image'}).length+' รูป'
        +(fromCustomer.filter(function(x){return x.a.type==='video'}).length

    +'<div class="note-box"><b>หมายเหตุจากลูกค้า</b><p>'+esc(c.customerNote||'-')+'</p></div>'
    +'</section>';

function appLink(page,extra){

}
function goApp(page,extra){window.location.href=appLink(page,extra)}

/* มอบหมายงาน — ON THIS PAGE (2026-09-15).

   Reported: "ปุ่มมอบหมายงานในหน้ารายละเอียดเคสอยากให้กดแล้วสามารถมอบหมายได้เลย ไม่จำเป็นต้อง
   เข้าไปหน้ามอบหมาย ที่มีหลายๆเคสเพราะมันจะงง". It used to send the visitor to the มอบหมายงาน
   page, which is a list of every case waiting — so after a full page load they had to find
   again the case they were already looking at. And since the same day that page only lists
   cases with NO technician, it could not have been used to change one either.

   Same rules as js/16's picker, so the two cannot disagree: the first technician ticked is
   the lead, a team lead may only pick inside their own team, and an admin (teamScope null)
   sees everybody. */
function teamScope(){
  var u=CaseDetailData.currentUser();
  if(!u)return null;
  var rec=null,list=CaseDetailData.allTechnicians();
  if(u.technicianId)rec=list.filter(function(t){return t.id===u.technicianId})[0]||null;
  if(rec&&rec.team)return rec.team;
  var role=CaseDetailData.roles().filter(function(r){return r.name===(u.permissionRole||u.role)})[0];
  if(role&&role.teamScope)return role.teamScope;
  if(u.accountType==='technician')return u.team||'Technical';
  return null;
}
function caseCrew(){
  var raw=caseDetailModel.raw||{};
  var out=[];
  if(Array.isArray(raw.assignees))out=raw.assignees.slice();
  if(!out.length&&raw.assignee)out=String(raw.assignee).split(',');
  return out.map(function(v){return String(v||'').trim()}).filter(Boolean);
}
/* Selection order decides the lead, so it is kept as an array rather than read back off the
   check boxes in DOM order. */
var assignPick=[];
function assignPanelHTML(){
  var scope=teamScope();
  var list=CaseDetailData.allTechnicians().filter(function(t){return !scope||(t.team||'Technical')===scope});
  if(!list.length){
    return '<p class="sd-hint">ไม่มีช่างในขอบเขตของบัญชีนี้</p>';
  }
  var teams=[];
  list.forEach(function(t){var k=t.team||'Technical';if(teams.indexOf(k)<0)teams.push(k)});
  var body=teams.map(function(team){
    return '<div class="sd-team"><b>ทีม '+esc(team)+'</b><div class="sd-members">'
      +list.filter(function(t){return (t.team||'Technical')===team}).map(function(t){
        var on=assignPick.indexOf(t.id)>=0;
        return '<label class="sd-member'+(on?' is-on':'')+'">'
          +'<input type="checkbox" data-assign-tech="'+esc(t.id)+'"'+(on?' checked':'')+'>'
          +'<span>'+esc(t.name||t.id)+'</span>'
          +'<small>'+esc(t.status||'พร้อมรับงาน')+'</small></label>';
      }).join('')+'</div></div>';
  }).join('');
  var names=assignPick.map(function(id){
    var t=list.filter(function(x){return x.id===id})[0];
    return (t&&t.name)||id;
  });

/* ลบเคส. This page still writes no business data — deleting has to move the record into
   ถังขยะ, drop the Supabase row and re-render the lists, and only the application can do
   all three. So the button hands the case over the same way นัดหมาย and เปลี่ยนสถานะ do,
   with intent=delete, and js/28 calls imodeDeleteCase() there. That function asks for
   confirmation and checks case.edit itself, which is why this side does not ask twice. */
function deleteCase(){
  var id=caseDetailModel&&caseDetailModel.case&&caseDetailModel.case.id;
  if(!id){toast('ไม่พบเคส');return}
  toast('กำลังเปิดระบบหลักเพื่อยืนยันการลบเคส…');
  setTimeout(function(){goApp('cases','&caseId='+encodeURIComponent(id)+'&intent=delete')},450);
}
/* This page still writes no business data. Stopping the response clock leaves one entry in
   imode_v70_case_responded — the device-local mirror js/48 owns — and the application
   applies it to the case and pushes it to Supabase on its next load. Handing the visitor
   back instead does not work: js/46 requires a password on every load, so an intent in the
   URL is spent at the login door and lost. */
var RESPONSE_MIRROR='imode_v70_case_responded';
function responseMirror(){
  try{var o=JSON.parse(localStorage.getItem(RESPONSE_MIRROR)||'{}');return (o&&typeof o==='object')?o:{}}
  catch(e){return {}}
}
/* The case's own field when the application has already applied it, this device's mirror
   while it has not, so the card reads the same either way. */
function respondedStamp(c){
  if(c&&c.respondedAt)return {at:c.respondedAt,by:c.respondedBy||''};
  var e=responseMirror()[c&&c.id];
  return e?{at:e.at,by:e.by||''}:null;
}
function markResponded(){
  var c=caseDetailModel&&caseDetailModel.case;
  if(!c){toast('ไม่พบเคส');return}
  if(respondedStamp(c)){toast('บันทึกการตอบกลับไว้แล้ว');return}
  try{
    var o=responseMirror();
    o[c.id]={at:new Date().toISOString(),by:''};
    localStorage.setItem(RESPONSE_MIRROR,JSON.stringify(o));
  }catch(e){toast('บันทึกไม่สำเร็จบนอุปกรณ์นี้');return}
  var host=document.querySelector('.scd-sla');
  if(host&&host.parentNode){
    var wrap=document.createElement('div');
    wrap.innerHTML=renderSla(caseDetailModel);
    host.parentNode.replaceChild(wrap.firstChild,host);
  }
  toast('บันทึกว่าตอบกลับลูกค้าแล้ว · นาฬิกาตอบกลับหยุดแล้ว');
}

/* ติดต่อลูกค้า — the channels exist as data on the customer; sending is not implemented
   anywhere in this application yet, so a channel with no destination says so. */
function contactCustomer(channel){
  var cu=caseDetailModel.customer;
  if(channel==='phone'){
    if(!cu.phone)return toast('เคสนี้ยังไม่มีเบอร์โทรของผู้ติดต่อ');
    window.location.href='tel:'+String(cu.phone).replace(/[^0-9+]/g,'');return;
  }
  if(channel==='email'){
    if(!cu.email)return toast('ลูกค้ารายนี้ยังไม่มีอีเมลในระบบ');
    window.location.href='mailto:'+cu.email+'?subject='+encodeURIComponent(caseDetailModel.case.caseNo);return;
  }
  if(channel==='line'){
    if(!cu.lineUserId)return toast('ลูกค้ารายนี้ยังไม่ได้เชื่อม LINE OA');
    return toast('การส่งข้อความ LINE จะเชื่อมกับ LINE Messaging API ในขั้นถัดไป');
  }
  if(channel==='whatsapp'){
    if(!cu.whatsapp)return toast('ลูกค้ารายนี้ยังไม่มี WhatsApp ในระบบ');
    window.open('https://wa.me/'+String(cu.whatsapp).replace(/[^0-9]/g,''),'_blank','noopener');return;
  }
}

function onMediaKey(e){if(e.key==='Escape'){e.preventDefault();closeMediaView()}}

    +(item.type==='video'
      ?'<video src="'+esc(item.data)+'" controls autoplay playsinline></video>'

    +'<div class="cmp-lightbox-bar"><b>'+esc(item.name||'ไฟล์แนบ')+'</b>'
    +'<button type="button" class="cmp-lightbox-close" data-media-close="1" aria-label="ปิด">&#10005;</button>'
    +'</div></div>';
  wrap.addEventListener('click',function(e){if(e.target===wrap)closeMediaView()});
  document.body.appendChild(wrap);
  document.addEventListener('keydown',onMediaKey,true);
  var btn=wrap.querySelector('.cmp-lightbox-close');
  if(btn)btn.focus();
}

  'add-attachment':function(){toast('การแนบไฟล์เพิ่มจะทำผ่านใบตรวจ / สถานะหน้างานในระบบหลัก')},
  'close-panel':function(){el('scdPanel').innerHTML='';},
  /* Back to the list. history.back() when the visitor came from the app, so the browser's
     own Back and this button do the same thing and no entry is left dangling; a direct
     link (a bookmark, a pasted URL) has nothing to go back to, so it goes to the list. */
  'go-back':function(){
    if(document.referrer&&document.referrer.indexOf(location.origin)===0&&history.length>1){
      history.back();return;
    }
    goApp('cases');
  },
  'open-app':function(){window.location.href=APP},
  'open-notifications':function(){goApp('notifications')},
  'toggle-language':function(){toast('ภาษาเปลี่ยนได้จากระบบหลัก · หน้านี้ยังใช้ภาษาไทย')}
};
document.addEventListener('click',function(e){
  if(e.target.closest('[data-media-close]')){closeMediaView();return}
  var tile=e.target.closest('[data-media]');
  if(tile){e.preventDefault();openMediaView(tile.getAttribute('data-media'));return}
  var contact=e.target.closest('[data-contact]');
  if(contact){contactCustomer(contact.getAttribute('data-contact'));return}
  var step=e.target.closest('[data-step]');
  if(step&&!step.disabled){
    e.preventDefault();
    stepPressed(Number(step.getAttribute('data-step'))||0,step.getAttribute('data-role')||'open');
    return;
  }
  var setst=e.target.closest('[data-set-status]');
  if(setst){e.preventDefault();applyStatus(setst.getAttribute('data-set-status'),'');return}
  var btn=e.target.closest('[data-action]');
  if(!btn)return;
  var fn=HANDLERS[btn.getAttribute('data-action')];
  if(fn){e.preventDefault();fn()}
});
/* The crew check boxes answer `change`, not `click`: a click that lands on the label text
   never reaches the input through closest(), and the order the boxes are ticked in is what
   decides the lead. */
document.addEventListener('change',function(e){
  var tech=e.target&&e.target.closest&&e.target.closest('[data-assign-tech]');
  if(!tech)return;
  var tid=tech.getAttribute('data-assign-tech'),at=assignPick.indexOf(tid);
  if(tech.checked&&at<0)assignPick.push(tid);
  else if(!tech.checked&&at>=0)assignPick.splice(at,1);
  var lab=tech.closest('.sd-member');
  if(lab)lab.classList.toggle('is-on',!!tech.checked);
  refreshAssignPanel();
});
el('scdSearch').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&this.value.trim())goApp('cases','&q='+encodeURIComponent(this.value.trim()));
});

/* Expose the pieces the integration prompt names, so they can be driven from a console
   or a future test without reaching into the closure. */
window.CaseDetailData=CaseDetailData;
window.caseDetailModel=caseDetailModel;
window.getCaseIdFromUrl=getCaseIdFromUrl;
window.contactCustomer=contactCustomer;
window.scdReady=false;

load().then(function(res){
  if(res&&res.error){renderError(res.error);window.scdReady=true;return}
  renderPage(res);
  window.scdReady=true;
}).catch(function(err){
  renderError('not-found');
  window.scdReady=true;
});
})();
</script>
